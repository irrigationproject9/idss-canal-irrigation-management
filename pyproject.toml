[project]
name = "idss-canal-irrigation-management"
version = "0.1.0"
description = "Intelligent Decision Support System for Canal Irrigation Management with PRESTO integration"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "geopandas>=0.14.0",
    "psycopg2-binary>=2.9.9",
    "pydantic-settings>=2.2.0",
    "pyomo>=6.7.0",
    "python-dotenv>=1.0.0",
    "rasterio>=1.3.9",
    "shapely>=2.0.2",
    "sqlalchemy>=2.0.25",
    "uvicorn>=0.27.0",
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "transformers>=4.36.0",
]

[project.scripts]
idss-canal-irrigation-management = "idss_canal_irrigation_management:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
